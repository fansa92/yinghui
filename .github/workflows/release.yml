name: Release

# 影汇 YingHui release: push a v* tag or manual dispatch (dispatch builds
# only; the Release is published on tag builds only).
# 6 artifacts: Android APK (per-ABI, signed) + iOS IPA (unsigned) +
# macOS DMG (unsigned) + Windows ZIP (unsigned).
# Unsigned means: iOS cannot be installed directly on a real device
# (needs signing/sideloading), macOS will show a Gatekeeper warning,
# Windows is an unzip-and-run folder, not a signed installer.
# Version rule: pubspec stays 0.1.0+1; the release version is the tag
# (e.g. tag v0.1 -> release v0.1), passed to every build as
# --dart-define=APP_VERSION; the app never hard-codes a version.
#
# Before tagging, set these 4 Android signing secrets in the repo
# (missing any one fails the Android job — never falls back to a
# throwaway self-signed key, or a later formally-signed build could
# not upgrade over it):
#   ANDROID_KEYSTORE_BASE64    keystore file as base64 text
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias used when the keystore was made
#   ANDROID_KEY_PASSWORD       key password
# No API key/secret secrets are needed: Navidrome/Emby/qBittorrent/
# Transmission/aria2 credentials are entered in the app's Servers page
# and stored in flutter_secure_storage on the user's device.
#
# Platform projects (android/, ios/, macos/, windows/) were generated by
# `flutter create` on this project; launcher icons were regenerated from
# assets/logo.png with flutter_launcher_icons (see
# flutter_launcher_icons.yaml). The first CI run is the first real
# compile check of those platform projects — do not claim they are
# verified until a run is green.
# android/app/build.gradle.kts reads signing from key.properties
# (falls back to the debug key when the file is absent locally; CI
# checks the secrets first and fails without them).
#
# Apple runner is macos-26 (Xcode 26 / Swift 6.2), same as douya's
# release workflow — do not move back to macos-15 without checking
# the Swift version the plugins need.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'
  # Settings About version: the release tag on tag builds (v0.1),
  # 'dev' on dispatch/local builds. Passed to every platform build
  # as --dart-define=APP_VERSION; never hard-coded in the app.
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

permissions:
  contents: write

jobs:
  # Test gate: pure unit tests under test/ (no network, no device).
  # Runs first; all four platform builds need it, so a failing test
  # stops the release before any platform build starts.
  test:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    name: Android APK (multi-arch, signed)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android project exists
        run: |
          if [ ! -d android ] || [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::android/ project missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Check Android signing secrets
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            case "$v" in
              ANDROID_KEYSTORE_BASE64) val="${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ;;
              ANDROID_KEYSTORE_PASSWORD) val="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ;;
              ANDROID_KEY_ALIAS) val="${{ secrets.ANDROID_KEY_ALIAS }}" ;;
              ANDROID_KEY_PASSWORD) val="${{ secrets.ANDROID_KEY_PASSWORD }}" ;;
            esac
            if [ -z "$val" ]; then
              echo "::error::$v not set: set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD in repo Secrets first"
              exit 1
            fi
          done

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Resolve version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.1.0"; fi
          IFS='.' read -ra P <<< "$V"; while [ ${#P[@]} -lt 3 ]; do P+=(0); done
          echo "BUILD_NAME=${P[0]}.${P[1]}.${P[2]}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Rename APKs
        run: |
          mkdir -p dist
          TAG="${RELEASE_TAG:-v0.1}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$f" "dist/YingHui-${TAG}-${abi}.apk"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  ios:
    name: iOS IPA (unsigned, no codesign)
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Check iOS project exists
        run: |
          if [ ! -d ios ]; then
            echo "::error::ios/ project missing"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.1.0"; fi
          IFS='.' read -ra P <<< "$V"; while [ ${#P[@]} -lt 3 ]; do P+=(0); done
          echo "BUILD_NAME=${P[0]}.${P[1]}.${P[2]}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - run: flutter pub get
      - name: Build IPA (unsigned)
        run: |
          flutter build ipa --release --no-codesign \
            --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Package unsigned IPA
        run: |
          mkdir -p dist build/ios/ipa
          TAG="${RELEASE_TAG:-v0.1}"
          if ls build/ios/ipa/*.ipa 1>/dev/null 2>&1; then
            cp "$(ls build/ios/ipa/*.ipa | head -1)" "dist/YingHui-${TAG}-unsigned.ipa"
          else
            APP_PATH=$(find build/ios/archive -name "Runner.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "No Runner.app found in archive" && exit 1
            fi
            rm -rf /tmp/ipapack && mkdir -p /tmp/ipapack/Payload
            cp -R "$APP_PATH" /tmp/ipapack/Payload/
            cd /tmp/ipapack && zip -qry "$OLDPWD/dist/YingHui-${TAG}-unsigned.ipa" Payload
            cd "$OLDPWD"
          fi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  macos:
    name: macOS DMG (unsigned)
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Check macOS project exists
        run: |
          if [ ! -d macos ]; then
            echo "::error::macos/ project missing"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.1.0"; fi
          IFS='.' read -ra P <<< "$V"; while [ ${#P[@]} -lt 3 ]; do P+=(0); done
          echo "BUILD_NAME=${P[0]}.${P[1]}.${P[2]}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - run: flutter pub get
      - name: Build macOS (unsigned)
        run: |
          flutter build macos --release \
            --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Create DMG (unsigned)
        run: |
          brew install create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -print -quit)
          echo "App: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          TAG="${RELEASE_TAG:-v0.1}"
          mkdir -p dist
          create-dmg \
            --volname "影汇" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 175 120 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 475 120 \
            "dist/YingHui-${TAG}-macos.dmg" \
            "$APP_PATH"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Windows ZIP (unsigned)
    needs: test
    # Pinned to windows-2022 on purpose (same as douya v0.2): the
    # windows-latest image's newer MSVC can break native plugins.
    # Do not move back to windows-latest without re-checking.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows project exists
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            Write-Error "windows/ project missing"
            exit 1
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $v = $Matches[1] } else { $v = '0.1.0' }
          $p = $v.Split('.'); while ($p.Count -lt 3) { $p += '0' }
          "BUILD_NAME=$($p -join '.')" | Out-File -Append $env:GITHUB_ENV
          "BUILD_NUMBER=${{ github.run_number }}" | Out-File -Append $env:GITHUB_ENV

      - run: flutter pub get
      - name: Build Windows (unsigned)
        run: |
          flutter build windows --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $version = $Matches[1] } else { $version = '0.1' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\YingHui-v$version-windows-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: [android, ios, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: false
